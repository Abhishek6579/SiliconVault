name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to publish from the selected master commit (without the v prefix)"
        required: true
        type: string
        default: "0.2.0-beta.1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-provenance:
    name: Verify approved master release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release source is an approved master commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_REF" != "refs/heads/master" ]]; then
              echo "::error::Manual releases may only be dispatched from master (selected ref: $EVENT_REF)."
              exit 1
            fi
            if [[ -z "$RELEASE_VERSION" || ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::A valid SemVer release version is required."
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
              echo "::error::Tag v$RELEASE_VERSION already exists; releases must never retarget an existing tag."
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$EVENT_REF" != refs/tags/v* ]]; then
              echo "::error::Release workflow push events must originate from a v* tag."
              exit 1
            fi
          else
            echo "::error::Unsupported release event: $EVENT_NAME"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/master; then
            echo "::error::Release commit $RELEASE_SHA is not reachable from approved master history."
            exit 1
          fi
          echo "Verified $RELEASE_SHA is reachable from origin/master."

  frontend-validation:
    name: Release frontend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build

  windows-release:
    name: Build and publish Windows installers
    permissions:
      contents: write
    needs:
      - release-provenance
      - frontend-validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify tag and application versions
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tagVersion = "${{ inputs.version }}"
          } else {
            $tagVersion = "${{ github.ref_name }}".Substring(1)
          }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?ms)^\[package\]\s.*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not read [package].version from Cargo.toml" }
          $versions = @($package.version, $tauri.version, $lock.version, $lock.packages."".version, $match.Groups[1].Value)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "Tag v$tagVersion must match package.json, package-lock.json, tauri.conf.json, and Cargo.toml. Found: $($versions -join ', ')"
          }
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag is not valid SemVer: $tagVersion"
          }
      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in GitHub Actions secrets."
          }
      - name: Install dependencies
        run: npm ci
      - name: Build signed Windows installers
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate signed updater manifest and SHA-256 checksums
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue)
          if ($nsis.Count -eq 0) { throw "NSIS installer was not generated." }
          if ($msi.Count -eq 0) { throw "MSI installer was not generated." }

          $installers = @($nsis) + @($msi)
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

          $updaterInstaller = $nsis | Select-Object -First 1
          $signaturePath = "$($updaterInstaller.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "NSIS updater signature was not generated: $signaturePath" }
          $tagVersion = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".Substring(1) }
          $releaseNotes = Get-Content "release-notes/v$tagVersion.md" -Raw
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) { throw "Release notes file is missing or empty for v$tagVersion." }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $assetUrl = "https://github.com/Abhishek6579/SiliconVault/releases/download/v$tagVersion/$($updaterInstaller.Name)"
          $manifest = @{
            version = $tagVersion
            notes = $releaseNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $assetUrl
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifest | Set-Content -Encoding utf8 latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SiliconVault ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes/v0.2.0-beta.1.md
          generate_release_notes: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            SHA256SUMS.txt
            latest.json
      - name: Publish rolling updater manifest to slave
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'updates/latest.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'slave' });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = fs.readFileSync('latest.json');
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'slave',
              message: 'chore(updater): publish ' + process.env.RELEASE_VERSION,
              content: content.toString('base64'),
              ...(sha ? { sha } : {}),
            });

