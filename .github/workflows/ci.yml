name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build



  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install temporary Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser workflows
        run: npm run test:e2e

  windows-desktop:
    name: Windows desktop build
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify stable Windows install identity against master
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          $baseJson = (git show origin/master:src-tauri/tauri.conf.json | Out-String) | ConvertFrom-Json
          $candidate = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($candidate.identifier -ne $baseJson.identifier) {
            throw "Tauri application identifier changed; an installed upgrade may use a different WebView2 profile."
          }
          if ($candidate.bundle.windows.nsis.installMode -ne $baseJson.bundle.windows.nsis.installMode) {
            throw "NSIS installation scope changed; installed-upgrade compatibility requires explicit migration."
          }
          foreach ($target in @("nsis", "msi")) {
            if ($candidate.bundle.targets -notcontains $target) { throw "Missing required Windows installer target: $target" }
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Tauri application
        run: npm run tauri:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: siliconvault-windows-pr-${{ github.event.pull_request.number }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
