name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Enforce platform and storage boundaries
        run: npm run check:architecture
      - name: Production build
        run: npm run build

  performance-benchmarks:
    name: Startup, query, and memory benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for storage benchmark
        run: npx playwright install --with-deps chromium
      - name: Measure database startup and indexed query workloads
        run: npm run benchmark:storage
      - name: Measure backup JSON parse memory
        run: npm run benchmark:backup-memory

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high


  windows-desktop:
    name: Windows desktop build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/slave') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify stable Windows install identity against master
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          $baseJson = (git show origin/master:src-tauri/tauri.conf.json | Out-String) | ConvertFrom-Json
          $candidate = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($candidate.identifier -ne $baseJson.identifier) {
            throw "Tauri application identifier changed; an installed upgrade may use a different WebView2 profile."
          }
          if ($candidate.bundle.windows.nsis.installMode -ne $baseJson.bundle.windows.nsis.installMode) {
            throw "NSIS installation scope changed; installed-upgrade compatibility requires explicit migration."
          }
          foreach ($target in @("nsis", "msi")) {
            if ($candidate.bundle.targets -notcontains $target) { throw "Missing required Windows installer target: $target" }
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Enforce platform and storage boundaries
        run: npm run check:architecture
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured."
          }
          if ($null -eq $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured."
          }
      - name: Run Rust tests (allow Cargo to refresh the lockfile for the new updater dependency)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install native WebDriver prerequisites
        shell: pwsh
        run: |
          cargo install --locked tauri-driver
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Run native desktop UI integration tests
        run: npm run test:desktop
      - name: Build signed Tauri application
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: siliconvault-windows-slave
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 14

  linux-desktop:
    name: Linux desktop packages (non-blocking secondary target)
    # Linux packaging must never block the Windows primary validation gate.
    continue-on-error: true
    if: (github.event_name == 'push' && github.ref == 'refs/heads/slave') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libssl-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkitgtk-webdriver xvfb
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify Linux WebDriver binary
        run: command -v WebKitWebDriver
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Enforce platform and storage boundaries
        run: npm run check:architecture
      - name: Verify updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install native WebDriver
        run: cargo install --locked tauri-driver
      - name: Run native desktop UI integration tests
        run: xvfb-run -a npm run test:desktop
      - name: Build signed AppImage and Debian packages
        run: npm run tauri:build -- --bundles appimage,deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: siliconvault-linux-slave
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/**/latest.json
          if-no-files-found: error
          retention-days: 14
